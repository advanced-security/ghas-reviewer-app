name: Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      bump:
        description: "Open a PR that bumps the version in .release.yml. Use none to publish the version already in .release.yml."
        type: choice
        options:
          - none
          - patch
          - minor
          - major
        default: none

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # A manual bump only opens a PR. Merging it to main starts the publish jobs below.
  bump-version:
    if: github.event_name == 'workflow_dispatch' && inputs.bump != 'none' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the version bump branch
      pull-requests: write # open the version bump PR
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # create-pull-request configures its own credentials from the token input.
          persist-credentials: false

      # Updates .release.yml, ghasreview/__init__.py and the versioned docker pull example in README.md.
      - name: Bump version
        # TODO: Return to the upstream action after its runtime image is digest-pinned:
        # https://github.com/42ByteLabs/patch-release-me/issues/169
        uses: docker://ghcr.io/42bytelabs/patch-release-me:0.6.7@sha256:b9624359ce08707dfb4d22bcbf9d1a75f7f4718ccec610ddaa62280ffea98958
        with:
          args: --disable-banner bump -m ${{ inputs.bump }}

      - name: Read bumped version
        id: version
        run: |
          version=$(ruby -ryaml -e 'puts YAML.safe_load_file(".release.yml").fetch("version")')
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Expected a stable semantic version in .release.yml after the bump"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create release pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          # Pull requests opened with GITHUB_TOKEN do not trigger pull_request workflows.
          token: ${{ github.token }}
          base: main
          branch: chore/release-v${{ steps.version.outputs.version }}
          commit-message: "chore: bump version to v${{ steps.version.outputs.version }}"
          title: "chore: bump version to v${{ steps.version.outputs.version }}"
          body: |
            Automated pull request to bump the release version to `v${{ steps.version.outputs.version }}` (${{ inputs.bump }} bump).

            It updates `.release.yml`, `ghasreview/__init__.py`, and the versioned Docker pull example in `README.md`.

            Merging this pull request to `main` starts the Release workflow, which scans and publishes the container image and then creates the GitHub release.

            > [!NOTE]
            > This pull request was opened with the default `GITHUB_TOKEN`, so GitHub does not start its checks automatically. Close and reopen it to run them before merging.

  prepare-release:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.bump == 'none')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(ruby -ryaml -e 'puts YAML.safe_load_file(".release.yml").fetch("version")')
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Expected a stable semantic version in .release.yml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

          released=$(gh api --paginate "/repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"v$version\") | .draft")
          if [[ "$released" == "false" ]]; then
            echo "Release v$version already exists; skipping publication."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          elif [[ "$released" == "true" ]]; then
            echo "::error::A draft release already exists for v$version; resolve it before publishing."
            exit 1
          fi

          # The reusable release workflow force-updates tags; never move a version tag.
          if git show-ref --verify --quiet "refs/tags/v$version"; then
            tagged_commit=$(git rev-parse "refs/tags/v${version}^{commit}")
            if [[ "$tagged_commit" != "$GITHUB_SHA" ]]; then
              echo "::error::Tag v$version already points to another commit; bump the version."
              exit 1
            fi
          fi

          image="${GITHUB_REPOSITORY,,}"
          registry_token=$(curl --fail --silent --show-error --get \
            --user "$GITHUB_ACTOR:$GH_TOKEN" \
            --data-urlencode "service=ghcr.io" \
            --data-urlencode "scope=repository:$image:pull" \
            https://ghcr.io/token | jq --exit-status --raw-output '.token | select(type == "string" and length > 0)')
          echo "::add-mask::$registry_token"
          response_file="$RUNNER_TEMP/release-manifest.json"
          for tag in "$version" "v$version"; do
            status=$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
              --header "Authorization: Bearer $registry_token" \
              --header "Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json" \
              "https://ghcr.io/v2/$image/manifests/$tag")
            case "$status" in
              200)
                echo "::error::Image ghcr.io/$image:$tag already exists; verify it and backfill its release, or bump the version. Versioned images must not be overwritten."
                exit 1
                ;;
              404)
                if ! jq --exit-status '.errors | any(.code == "MANIFEST_UNKNOWN" or .code == "NAME_UNKNOWN")' "$response_file" > /dev/null; then
                  echo "::error::Unexpected registry response while checking $tag; refusing to publish."
                  exit 1
                fi
                ;;
              *)
                echo "::error::Registry check for $tag failed with HTTP $status; refusing to publish."
                exit 1
                ;;
            esac
          done
          echo "publish=true" >> "$GITHUB_OUTPUT"

  scan-image:
    needs: prepare-release
    if: needs.prepare-release.outputs.publish == 'true'
    uses: advanced-security/reusable-workflows/.github/workflows/container-security.yml@d17063db5dc48cd6e9b704b3564d43fcf5b66e51
    secrets: inherit
    permissions:
      contents: read
      security-events: write
    with:
      version: ${{ needs.prepare-release.outputs.version }}

  publish-image:
    needs: [prepare-release, scan-image]
    uses: advanced-security/reusable-workflows/.github/workflows/container-publish.yml@d17063db5dc48cd6e9b704b3564d43fcf5b66e51
    secrets: inherit
    permissions:
      id-token: write
      contents: write
      packages: write
      attestations: write
    with:
      version: ${{ needs.prepare-release.outputs.version }}

  github-release:
    needs: [prepare-release, publish-image]
    uses: advanced-security/reusable-workflows/.github/workflows/release.yml@d17063db5dc48cd6e9b704b3564d43fcf5b66e51
    permissions:
      contents: write
      # Required by the shared workflow's optional README-update job.
      pull-requests: write
    with:
      version: ${{ needs.prepare-release.outputs.version }}
